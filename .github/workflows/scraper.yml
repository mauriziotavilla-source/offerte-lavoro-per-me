name: Scraper Offerte e Concorsi

on:
  workflow_dispatch:
    inputs:
      invia_test_push:
        description: "Invia notifica di test Firebase (senza aspettare nuove offerte)"
        required: false
        default: false
        type: boolean
      topic_test:
        description: "Topic test (offerte_lavoro, concorsi_pubblici, categorie_protette)"
        required: false
        default: "concorsi_pubblici"
        type: choice
        options:
          - offerte_lavoro
          - concorsi_pubblici
          - categorie_protette
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Installa dipendenze scraper
        working-directory: scripts
        run: npm install

      - name: Esegui scraper
        working-directory: scripts
        run: npm run scraper:run

      - name: Salva i file dati aggiornati
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessuna modifica ai dati"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: aggiorna offerte automatiche"
          git push

      - name: Invia notifiche push Android
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event.inputs.invia_test_push }}" = "true" ]; then
            echo "Modalità test push → topic ${{ github.event.inputs.topic_test }}"
            node scraper/send-push.js --test --topic=${{ github.event.inputs.topic_test }}
          else
            npm run scraper:push
          fi
