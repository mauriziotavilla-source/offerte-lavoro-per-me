name: Scraper Offerte e Concorsi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Installa dipendenze scraper
        working-directory: scripts
        run: npm install

      - name: Esegui scraper
        working-directory: scripts
        run: npm run scraper:run

      - name: Salva i file dati aggiornati
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessuna modifica ai dati"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: aggiorna offerte automatiche"
          git push

      - name: Invia notifiche push Android
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npm run scraper:push
